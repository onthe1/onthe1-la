<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>onthe1.AI</title>
<!--
  onthe1.la is a redirect, not a second site.

  It used to carry a full copy of the onthe1.ai pages. Two copies of one site
  means two things to keep in sync and two things for search engines to rank,
  so on 2026-09-10 Adam ruled that .la points at .ai instead of duplicating it.

  The redirect preserves the path, so onthe1.la/privacy.html lands on
  onthe1.ai/privacy.html rather than dumping every visitor on the home page.
  404.html carries the same script, which is what catches those sub-paths:
  GitHub Pages serves 404.html for anything that is not index.html, and this
  repository deliberately holds no other pages.

  The Open Graph block below is NOT decoration and is the reason this file is
  not three lines long. Social and chat link scrapers generally do not run
  JavaScript and do not follow a meta refresh, so without these tags a shared
  onthe1.la link previews as a blank card. Every asset it names is served from
  onthe1.ai, so there is nothing here to keep in sync.

  Email at @onthe1.la is unrelated to any of this. It is MX (Zoho) and does
  not pass through GitHub Pages.
-->
<link rel="canonical" href="https://onthe1.ai/">
<link rel="icon" type="image/svg+xml" href="https://onthe1.ai/favicon.svg">
<meta name="robots" content="noindex, follow">

<meta property="og:type" content="website">
<meta property="og:url" content="https://onthe1.ai/">
<meta property="og:site_name" content="onthe1.AI">
<meta property="og:title" content="onthe1.AI">
<meta property="og:description" content="We build your business its own private AI, connect it to the tools you already use, and keep it current. You never touch the tech.">
<meta property="og:image" content="https://onthe1.ai/assets/og-card.png">
<meta property="og:image:secure_url" content="https://onthe1.ai/assets/og-card.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="onthe1.AI">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="onthe1.AI">
<meta name="twitter:description" content="We build your business its own private AI, connect it to the tools you already use, and keep it current. You never touch the tech.">
<meta name="twitter:image" content="https://onthe1.ai/assets/og-card.png">

<meta http-equiv="refresh" content="1; url=https://onthe1.ai/">
<script>
  // Path-preserving, and first because it beats the meta refresh. `replace`
  // rather than `href` so the browser Back button returns to wherever the
  // visitor came from instead of bouncing them through here again.
  location.replace("https://onthe1.ai" + location.pathname + location.search + location.hash);
</script>
<style>
  html,body{height:100%;margin:0;}
  body{
    background:#080A09;color:#E7E9E6;
    font-family:'Avenir Next',system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;line-height:1.6;
  }
  a{color:#73FA79;}
</style>
</head>
<body>
  <!-- Seen only if JavaScript is off AND the meta refresh has not fired yet. -->
  <p>Redirecting to <a href="https://onthe1.ai/">onthe1.ai</a>.</p>
</body>
</html>
